<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --line: rgba(255,255,255,.14);
  --line-strong: rgba(255,255,255,.38);
  --text: #ececec;
  --sub: #8b8b90;
  --faint: #56565c;
  --accent: #4c9dff;
  --danger: #ff3b30;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--text); overflow: hidden; -webkit-user-select: none; cursor: default; }
.card { position: absolute; inset: 0; border: 1px solid var(--line-strong); border-radius: 10px; background: #060607; padding: 9px 12px 10px; display: flex; flex-direction: column; font-size: 12px; line-height: 1.5; }
.head { flex: none; height: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font: 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.head .right { display: flex; align-items: center; gap: 8px; color: var(--faint); }
.x { border: none; background: none; color: var(--faint); font-size: 11px; padding: 0; width: 14px; cursor: pointer; }
.x:hover { color: var(--danger); }
.body { flex: 1; min-height: 0; overflow-y: auto; }
.body::-webkit-scrollbar { width: 0; }
.empty { color: var(--faint); font-size: 11px; }
.note { color: var(--sub); font-size: 11px; line-height: 1.5; }

.todo { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
.todo i { width: 11px; height: 11px; border: 1px solid var(--line-strong); border-radius: 3px; flex: none; margin-top: 3px; cursor: pointer; position: relative; }
.todo i:hover { border-color: var(--text); }
.todo.done { color: var(--faint); text-decoration: line-through; }
.todo.done i::after { content: ""; position: absolute; inset: 2px; background: var(--sub); border-radius: 1px; }
.todo span { flex: 1; min-width: 0; }
.todo em, .dl em { font: normal 10px var(--mono); color: var(--faint); white-space: nowrap; padding-top: 1px; }
.todo em.late, .dl em.late { color: var(--danger); }

.tl { position: relative; padding-left: 14px; }
.tl::before { content: ""; position: absolute; left: 3.5px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.ev { position: relative; padding: 2px 0 6px; color: var(--sub); }
.ev::before { content: ""; position: absolute; left: -14px; top: 7px; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--line-strong); background: #060607; }
.ev.past { color: var(--faint); }
.ev.now { color: var(--text); }
.ev.now::before { border-color: var(--accent); background: var(--accent); }
.ev b { font: 400 10px var(--mono); margin-right: 7px; color: var(--faint); }

.dl { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.dl:last-child { border: none; }

.pomo { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.pomo svg { width: min(70%, 120px); max-height: 62%; }
.pomo .t { font: 300 16px var(--mono); fill: var(--text); }
.pomo .ctl { display: flex; gap: 5px; }
.pomo button { border: 1px solid var(--line-strong); background: transparent; color: var(--text); border-radius: 5px; font: 9.5px var(--mono); letter-spacing: .06em; padding: 3px 8px; cursor: pointer; }
.pomo button:hover { border-color: var(--text); }
.pomo.ring-done .card { border-color: var(--danger); }

.clock { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.clock .t { font: 200 28px var(--mono); letter-spacing: .02em; }
.clock .d { font: 9.5px var(--mono); letter-spacing: .06em; color: var(--sub); text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><span id="title"></span><span class="right"><span id="meta"></span><button class="x" id="close" title="Close">✕</button></span></div>
  <div class="body" id="body"></div>
</div>
<script>
const type = window.WIDGET_TYPE || "clock";
const post = (m) => window.webkit && window.webkit.messageHandlers.widget.postMessage(m);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("close").onclick = () => post({ type: "close" });

const TITLES = { todo: "To-do", timeline: "Today", deadline: "Due Today", pomodoro: "Pomodoro", clock: "Clock" };
$("title").textContent = TITLES[type] || type;

function denied(what) {
  $("body").innerHTML = `<div class="note">Allow ${what} access in System Settings → Privacy &amp; Security → ${what}, then press Apply again.</div>`;
}

window.setData = (d) => {
  if (type === "todo") {
    if (d.denied) return denied("Reminders");
    $("meta").textContent = d.items.length;
    $("body").innerHTML = d.items.length ? d.items.map((r) =>
      `<div class="todo" data-id="${esc(r.id)}"><i></i><span>${esc(r.title)}</span>${r.due ? `<em class="${r.late ? "late" : ""}">${esc(r.due)}</em>` : ""}</div>`).join("")
      : `<div class="empty">Nothing to do</div>`;
    document.querySelectorAll(".todo i").forEach((box) => box.onclick = () => {
      const row = box.parentElement;
      row.classList.add("done");
      post({ type: "complete", id: row.dataset.id });
    });
  }
  if (type === "timeline") {
    if (d.denied) return denied("Calendars");
    $("meta").textContent = d.date;
    $("body").innerHTML = d.events.length ? `<div class="tl">${d.events.map((e) =>
      `<div class="ev ${e.state}"><b>${esc(e.time)}</b>${esc(e.title)}</div>`).join("")}</div>`
      : `<div class="empty">No events today</div>`;
  }
  if (type === "deadline") {
    if (d.denied) return denied("Reminders");
    $("meta").textContent = d.items.length;
    $("body").innerHTML = d.items.length ? d.items.map((r) =>
      `<div class="dl"><span>${esc(r.title)}</span><em class="${r.late ? "late" : ""}">${esc(r.due)}</em></div>`).join("")
      : `<div class="empty">Nothing due today</div>`;
  }
};

if (type === "clock") {
  $("body").innerHTML = `<div class="clock"><div class="t" id="t"></div><div class="d" id="d"></div></div>`;
  const tick = () => {
    const n = new Date();
    $("t").textContent = `${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
    $("d").textContent = n.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).replace(",", "");
  };
  tick(); setInterval(tick, 5000);
}

if (type === "pomodoro") {
  let total = 25 * 60, left = total, timer = null;
  $("body").innerHTML = `<div class="pomo">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
      <circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="#ececec" stroke-width="1.5" stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
      <text id="pt" class="t" x="50" y="55" text-anchor="middle"></text></svg>
    <div class="ctl"><button id="go">START</button><button id="reset">RESET</button><button id="len">25/50</button></div></div>`;
  const draw = () => {
    $("pt").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("arc").setAttribute("stroke-dashoffset", String(264 * (1 - left / total)));
    $("meta").textContent = timer ? "focus" : "";
  };
  const stop = () => { clearInterval(timer); timer = null; $("go").textContent = "START"; draw(); };
  $("go").onclick = () => {
    if (timer) return stop();
    $("go").textContent = "PAUSE";
    timer = setInterval(() => {
      left = Math.max(0, left - 1);
      if (left === 0) { stop(); post({ type: "pomodoroDone" }); left = total; }
      draw();
    }, 1000);
    draw();
  };
  $("reset").onclick = () => { stop(); left = total; draw(); };
  $("len").onclick = () => { stop(); total = total === 25 * 60 ? 50 * 60 : 25 * 60; left = total; draw(); };
  draw();
}

if (["todo", "timeline", "deadline"].includes(type)) $("body").innerHTML = `<div class="empty">Loading…</div>`;
post({ type: "ready" });
</script>
</body>
</html>
